name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web app — lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Generate Next.js route types
        run: bunx next typegen

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

  engine:
    name: Scan engine — transpile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install engine dependencies
        run: cd mini-services/scan-service && bun install

      - name: Transpile engine
        run: bun build mini-services/scan-service/index.ts --target bun --outfile dist/engine-check.js
